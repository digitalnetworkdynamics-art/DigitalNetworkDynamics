<!DOCTYPE html>
<html lang="en">

<head>

<title>DND Dashboard</title>

<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container {
    margin:50px auto;
    max-width:500px;
    background:#111;
    padding:30px;
    border-radius:20px;
}

h1 {
    color:#00ff99;
}

.balance {
    font-size:45px;
    margin:30px;
}

.card {
    background:#0b0b0b;
    padding:20px;
    margin:20px 0;
    border-radius:15px;
}

button {
    background:#00ff99;
    border:none;
    padding:15px 40px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="container">

<h1>
DND Dashboard
</h1>


<p>
Welcome to Digital Network Dynamics
</p>


<div class="card">

<h3>
Balance
</h3>

<div class="balance">
0.000000 DND
</div>

</div>



<div class="card">

<h3>
Mining Status
</h3>

<p>
Inactive
</p>


<button>
START MINING
</button>

</div>




<div class="card">

<h3>
Wallet Address
</h3>

<p>
DND-XXXX-XXXX
</p>

</div>



<div class="card">

<h3>
Transactions
</h3>

<p>
No transactions yet
</p>

</div>


</div>


</body>

</html>
